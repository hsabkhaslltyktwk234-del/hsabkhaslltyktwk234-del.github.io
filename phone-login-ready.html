<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول بالرقم</title>
<style>
  body{font-family:sans-serif;max-width:420px;margin:40px auto;padding:0 16px}
  input,button{width:100%;padding:12px;margin:8px 0;font-size:16px;box-sizing:border-box}
  button{background:#1a73e8;color:#fff;border:0;border-radius:8px}
  #step2{display:none}
  #msg{margin-top:12px;color:#c00}
</style>
</head>
<body>
<h2>تسجيل الدخول برقم التليفون</h2>

<div id="step1">
  <input id="phone" type="tel" placeholder="01012345678">
  <button id="send-btn">إرسال الكود</button>
</div>

<div id="step2">
  <input id="code" type="number" placeholder="الكود (6 أرقام)">
  <button id="verify-btn">دخول</button>
</div>

<p id="msg"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, RecaptchaVerifier, signInWithPhoneNumber }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

// الصق هنا إعدادات مشروعك: Project settings > Your apps > Web app > Config
const firebaseConfig = {
  apiKey: "AIzaSyBFYseh6eaDSYoe0uKaDNCPeynafkq_jiY",
  authDomain: "rayet-tefly-mz.firebaseapp.com",
  databaseURL: "https://rayet-tefly-mz-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "rayet-tefly-mz",
  storageBucket: "rayet-tefly-mz.firebasestorage.app",
  messagingSenderId: "396810379274",
  appId: "1:396810379274:web:f34fe821a2a1cd51e87ff3",
  measurementId: "G-4JNFV063MS"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
auth.languageCode = "ar";

const msg = document.getElementById("msg");
let confirmation = null;

window.recaptchaVerifier = new RecaptchaVerifier(auth, "send-btn", { size: "invisible" });

document.getElementById("send-btn").addEventListener("click", async () => {
  let phone = document.getElementById("phone").value.trim();
  if (phone.startsWith("0")) phone = "+20" + phone.slice(1);
  if (!phone.startsWith("+")) phone = "+" + phone;
  msg.textContent = "";
  try {
    confirmation = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);
    document.getElementById("step1").style.display = "none";
    document.getElementById("step2").style.display = "block";
  } catch (e) {
    msg.textContent = "فشل الإرسال: " + e.code;
  }
});

document.getElementById("verify-btn").addEventListener("click", async () => {
  const code = document.getElementById("code").value.trim();
  try {
    const result = await confirmation.confirm(code);
    msg.style.color = "green";
    msg.textContent = "تم الدخول: " + result.user.phoneNumber;
    // TODO: حوّل المستخدم للصفحة الرئيسية هنا
  } catch (e) {
    msg.textContent = "الكود غلط أو منتهي";
  }
});
</script>
</body>
</html>
