<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فحص التطبيق</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:16px;font-size:20px;line-height:1.6;background:#fff;color:#111}
button{font:inherit;font-weight:700;width:100%;padding:16px;border:0;border-radius:14px;background:#1565c0;color:#fff;margin:8px 0}
pre{direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;background:#f1f5f9;border-radius:12px;padding:12px;font-size:17px}
</style>
</head>
<body>
<h2>فحص تسجيل الدخول</h2>
<p>اضغط الزرار، استنى ثواني، وصوّر النتيجة كلها.</p>
<button id="go">ابدأ الفحص</button>
<pre id="out">جاهز.</pre>
<script>
var KEY="AIzaSyBFYseh6eaDSYoe0uKaDNCPeynafkq_jiY";
var out=document.getElementById('out');
function log(t){out.textContent+="\n"+t}
function call(path,body){
 return fetch("https://identitytoolkit.googleapis.com/v1/"+path+"?key="+KEY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
 .then(function(r){return r.text().then(function(t){return {s:r.status,t:t}})});
}
document.getElementById('go').onclick=function(){
 out.textContent="Page: "+location.href;
 log("\n--- TEST 1: login with fake account ---");
 call("accounts:signInWithPassword",{email:"nobody"+Date.now()+"@example.com",password:"Fake@12345x",returnSecureToken:true})
 .then(function(r){log("HTTP "+r.s);log(r.t.slice(0,600));
  log("\n--- TEST 2: create test account ---");
  return call("accounts:signUp",{email:"diag"+Date.now()+"@example.com",password:"Diag@12345x",returnSecureToken:true})})
 .then(function(r){log("HTTP "+r.s);var tok=null;try{tok=JSON.parse(r.t).idToken}catch(e){}
  log(tok?"SUCCESS: account created (token received)":r.t.slice(0,600));
  if(tok)return call("accounts:delete",{idToken:tok}).then(function(d){log("cleanup HTTP "+d.s+" (test account deleted)")})})
 .catch(function(e){log("NETWORK ERROR: "+e)})
 .then(function(){log("\nDONE")});
};
</script>
</body>
</html>
